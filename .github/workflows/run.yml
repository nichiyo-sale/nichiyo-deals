name: 日用品セール速報

on:
  schedule:
    # JST 7:15 / 12:10 / 18:20 / 21:35（UTC表記）
    - cron: "15 22 * * *"
    - cron: "10 3 * * *"
    - cron: "20 9 * * *"
    - cron: "35 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せずテストだけ（1=テスト）"
        default: "0"

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 実行
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          SITE_ORIGIN: ${{ secrets.SITE_ORIGIN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python bot.py
      - name: 価格履歴とページを保存
        if: always()
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && exit 0
          git commit -m "update $(TZ=Asia/Tokyo date '+%F %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
