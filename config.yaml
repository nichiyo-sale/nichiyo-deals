# ===== 楽天 日用品セール速報ボット 設定 =====
# ここを編集するだけで運用を調整できます。

# 楽天API（仕様変更時はここのURLだけ差し替え）
rakuten:
  search_endpoint: "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701"
  sleep_sec: 1.2          # APIへの連続アクセス間隔

# 監視する商品キーワード（1キーワード＝1リクエスト）
keywords:
  - トイレットペーパー
  - ボックスティッシュ
  - キッチンペーパー
  - 洗濯洗剤 詰め替え
  - 柔軟剤 詰め替え
  - 食器用洗剤 詰め替え
  - シャンプー 詰め替え
  - ボディソープ 詰め替え
  - ハンドソープ 詰め替え
  - ゴミ袋 45L
  - ミネラルウォーター 2L
  - 炭酸水 500ml
  - 歯ブラシ
  - 除菌シート
  - ラップ
  - 猫砂
  - ペットシーツ

# 商品の足切り条件
filter:
  min_price: 300
  max_price: 8000
  min_review_count: 30
  min_review_avg: 4.0
  free_shipping_only: true
  ng_words: ["中古", "ジャンク", "訳あり品", "福袋", "ふるさと納税"]

# お得判定
deal:
  lookback_days: 30       # 何日前までの最高値と比べるか
  min_history_days: 3     # 価格履歴が何日分たまったら値下がり判定するか
  min_drop: 0.10          # 10%以上の値下がりでお得判定
  min_point_rate: 5       # 雑貨系はポイント5倍以上でお得判定
  min_point_rate_consumable: 3   # 日用品（消耗品）はポイント3倍以上でお得判定
  # この言葉を含む商品は「雑貨」扱い。日用品と雑貨を交互に投稿する
  goods_words: ["ホルダー", "ケース", "スタンド", "ディスペンサー", "収納", "ラック", "カバー", "トレー", "ポット"]
  repost_block_days: 7    # 同じ商品は7日間再投稿しない

# 投稿
post:
  per_run: 1              # 1回の実行で投稿する数（1日4回実行→1日4投稿）
  use_image: true         # 商品画像付きで投稿

# Threadsのトピックタグ（1投稿1つ。状況に合わせて自動で切り替え）
tags:
  normal: ["ポイ活", "節約", "楽天お買い物", "日用品"]   # 通常時は順番に使う
  day_5_0: "楽天5と0のつく日"        # 5・10・15・20・25・30日
  day_1: "楽天ワンダフルデー"        # 毎月1日
  # セール期間（楽天の告知が出たら日付を追加。期間中はこのタグが最優先）
  sale_periods:
    # - {start: 2026-10-04, end: 2026-10-11, tag: "楽天お買い物マラソン"}
    # - {start: 2026-12-04, end: 2026-12-11, tag: "楽天スーパーセール"}

# まとめページ
site:
  title: "楽天 日用品セール速報"
  max_items: 40

# 毎朝のリプ素材（morning.py）
morning:
  links: 5        # 検索リンクの数
  drafts: 8       # リプライ下書きの数
  keywords: ["楽天 日用品", "ポイ活", "節約 主婦", "まとめ買い", "楽天 買い回り", "日用品 ストック", "洗剤 詰め替え", "トイレットペーパー 安い"]
