# ===== 楽天 底値ウォッチ ボット設定 =====
# ここを編集するだけで運用を調整できます。

# 楽天API（仕様変更時はここのURLだけ差し替え）
rakuten:
  search_endpoint: "https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701"
  ranking_endpoint: "https://openapi.rakuten.co.jp/ichibaranking/api/IchibaItem/Ranking/20220601"
  sleep_sec: 1.2          # APIへの連続アクセス間隔

# 監視する商品キーワード（1キーワード＝1リクエスト）
keywords:
  - トイレットペーパー
  - ボックスティッシュ
  - キッチンペーパー
  - 洗濯洗剤 詰め替え
  - 柔軟剤 詰め替え
  - 食器用洗剤 詰め替え
  - シャンプー 詰め替え
  - ボディソープ 詰め替え
  - ハンドソープ 詰め替え
  - ゴミ袋 45L
  - ミネラルウォーター 2L
  - 炭酸水 500ml
  - 歯ブラシ
  - 除菌シート
  - ラップ
  - 猫砂
  - ペットシーツ

# 全ジャンルの売れ筋ランキングから探す（ジャンルID: 表示名）
# 外したいジャンルは行頭に # を付ける
genres:
  100371: レディースファッション
  551177: メンズファッション
  100433: インナー・ルームウェア
  216131: バッグ・小物
  558885: 靴
  558929: 腕時計
  216129: アクセサリー
  100533: キッズ・ベビー
  566382: おもちゃ
  101070: スポーツ・アウトドア
  562637: 家電
  211742: AV・カメラ
  100026: パソコン周辺機器
  564500: スマホ・タブレット
  100227: 食品
  551167: スイーツ・お菓子
  100316: 水・ドリンク
  100804: インテリア・寝具
  215783: 日用品・文房具
  558944: キッチン用品
  101205: ゲーム
  101164: ホビー
  503190: カー用品
  100939: コスメ
  100938: 健康・ダイエット
  101213: ペット用品
  100005: 花・ガーデン・DIY

# 商品の足切り条件
filter:
  min_price: 300
  max_price: 30000
  min_review_count: 30
  min_review_avg: 4.0
  free_shipping_only: true
  ng_words: ["中古", "ジャンク", "訳あり品", "福袋", "ふるさと納税"]

# お得判定
deal:
  lookback_days: 30       # 何日前までの最高値と比べるか
  min_history_days: 3     # 価格履歴が何日分たまったら値下がり判定するか
  min_drop: 0.10          # 10%以上の値下がりでお得判定
  min_point_rate: 5       # 雑貨系はポイント5倍以上でお得判定
  min_point_rate_consumable: 3   # 日用品（消耗品）はポイント3倍以上でお得判定
  # この言葉を含む商品は「雑貨」扱い。日用品と雑貨を交互に投稿する
  goods_words: ["ホルダー", "ケース", "スタンド", "ディスペンサー", "収納", "ラック", "カバー", "トレー", "ポット"]
  repost_block_days: 7    # 同じ商品は7日間再投稿しない

# 投稿
post:
  per_run: 1              # 1回の実行で投稿する数（1日4回実行→1日4投稿）
  use_image: true         # 商品画像付きで投稿
  genre_spread: 4         # 直近4投稿と同じジャンルはなるべく避ける
  daily_every: 3          # 3投稿に1回は日用品を入れる

# Threadsのトピックタグ（1投稿1つ。状況に合わせて自動で切り替え）
tags:
  normal: ["楽天お買い物", "ポイ活", "節約", "お得情報"]   # 通常時は順番に使う
  day_5_0: "楽天5と0のつく日"        # 5・10・15・20・25・30日
  day_1: "楽天ワンダフルデー"        # 毎月1日
  # セール期間（楽天の告知が出たら日付を追加。期間中はこのタグが最優先）
  sale_periods:
    # - {start: 2026-10-04, end: 2026-10-11, tag: "楽天お買い物マラソン"}
    # - {start: 2026-12-04, end: 2026-12-11, tag: "楽天スーパーセール"}

# まとめページ
site:
  title: "楽天 底値ウォッチ"
  max_items: 40

# 毎朝のリプ素材（morning.py）
morning:
  links: 5        # 検索リンクの数
  drafts: 8       # リプライ下書きの数
  keywords: ["楽天 日用品", "ポイ活", "節約 主婦", "まとめ買い", "楽天 買い回り", "日用品 ストック", "洗剤 詰め替え", "トイレットペーパー 安い"]
